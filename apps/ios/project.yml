name: RoamDesk
options:
  bundleIdPrefix: au.com.roamdesk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team here (or pass DEVELOPMENT_TEAM=... to xcodebuild) before building for a real iPhone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RoamDesk:
    type: application
    platform: iOS
    sources:
      - path: RoamDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.roamdesk.ios
        INFOPLIST_FILE: RoamDesk/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  RoamDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoamDeskTests
    dependencies:
      - target: RoamDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: au.com.roamdesk.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RoamDesk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RoamDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RoamDesk:
    build:
      targets:
        RoamDesk: all
    test:
      targets:
        - RoamDeskTests
